# Three nodes that find each other through one name, with no list of peers. From the folder of the package:
#
#   docker compose -f examples/docker-compose.discover.yml up --build
#   docker compose -f examples/docker-compose.discover.yml up --scale node=5   # two more join within DISCOVER_MS
#
# The name `node` is the service: Docker's DNS answers it with the address of each replica, and each replica looks it
# up every `DISCOVER_MS` and dials the addresses that it is not linked with. The answer has its own address too, which
# the node finds out when it dials it and then leaves alone. Without TLS (it is planned) the frames are not encrypted,
# so `INSECURE` only for a network that you trust, such as this one. Change the cookie: it is an example value.
services:
  node:
    build:
      context: ..
      dockerfile: examples/Dockerfile
    deploy:
      replicas: 3
    environment:
      NODE_HOST: 0.0.0.0
      NODE_PORT: "7000"
      NAME_FROM_HOSTNAME: "1"
      DISCOVER: node:7000
      DISCOVER_MS: "2000"
      INSECURE: "1"
      CLUSTER_COOKIE: ${CLUSTER_COOKIE:-an-example-cookie-of-16-bytes-or-more}
