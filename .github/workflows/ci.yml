name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The nightly of Miri and of the doctests that check error codes, pinned so a new nightly cannot break CI by itself.
  NIGHTLY: nightly-2026-11-01

jobs:
  # A pull request runs only the packages whose files changed (the rules are in the script); a push to main runs all of
  # them. Each package runs on the Agentica version of its AGENTICA_VERSION file, so the packages are grouped by
  # version: one job of `packages` per group.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history of the base branch, for the diff of a pull request.
          fetch-depth: 0

      - name: Find the changed packages and their versions
        id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        # The diff goes to a file first: in a pipe a failed git diff (no base branch, no merge base) would read as
        # "no package changed" and turn the required check green untested. groups is a JSON list of
        # {version, sha256, packages}, `[]` when no package changed.
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            packages=$(.github/scripts/changed-packages.sh < "$RUNNER_TEMP/changed-files")
          else
            packages=$(.github/scripts/changed-packages.sh --all)
          fi
          : > "$RUNNER_TEMP/versions"
          for p in $packages; do
            read -r version sha256 rest < "$p/AGENTICA_VERSION" || true
            if [ -z "${version:-}" ] || [ -z "${sha256:-}" ]; then
              echo "$p/AGENTICA_VERSION must hold the version and the sha256 of its linux-x86_64 archive" >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$version" "$sha256" "$p" >> "$RUNNER_TEMP/versions"
          done
          groups=$(jq -cR -s 'split("\n") | map(select(. != "") | split("\t"))
            | group_by(.[0]) | map({version: .[0][0], sha256: .[0][1], packages: (map(.[2]) | join(" "))})' \
            "$RUNNER_TEMP/versions")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          if [ -n "$packages" ]; then echo "Packages to run: $groups"; else echo "No package changed: nothing to run."; fi

  # The packages of one Agentica version, on that release (setup-agentica caches each version).
  packages:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    name: packages (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Agentica release of the group
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}

      # The locked packages of each folder, checked against the hashes of its agentica.lock. The Makefile takes the
      # list as an argument: its own assignment ignores the environment.
      - name: Install the packages
        run: |
          echo "Agentica $(agentica --version): $PACKAGES"
          make install PACKAGES="$PACKAGES"

      - name: Check
        run: make check PACKAGES="$PACKAGES"

      - name: Format
        run: make fmt-check PACKAGES="$PACKAGES"

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        run: make test PACKAGES="$PACKAGES"

      # The agentica code blocks of each docs/ folder run, or are checked.
      - name: Doc examples
        run: make doc-examples PACKAGES="$PACKAGES"

  # `test` is the required check, so it carries the result of the other jobs: it fails when the plan or the rust job
  # did not pass, or when a group of packages failed (`packages` is skipped when no package changed).
  test:
    needs: [plan, packages, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the other jobs passed
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGES: ${{ needs.packages.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "plan: $PLAN, packages: $PACKAGES, rust: $RUST"
          [ "$PLAN" = success ] && [ "$RUST" = success ] && { [ "$PACKAGES" = success ] || [ "$PACKAGES" = skipped ]; }

  # The Rust crate of native-gen (native-gen/native/agentica-native), when a pull request changes native-gen or this
  # file, and on main: its format and lints on stable, its tests on the MSRV of its Cargo.toml and on stable, its
  # doctests on nightly (which checks the error codes of the compile_fail ones), the tests under Miri, vm-check, a
  # module on the crate run by the Agentica release of native-gen (its AGENTICA_VERSION), gen-check, the modules on the
  # Rust files native-gen makes, build-check, `cli.agc build` of a Rust module, and new-check, the module
  # `new --lang rust` writes. The crate has no dependencies, so it needs no registry.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native-gen/native/agentica-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Find whether the crate changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "RUST=1" >> "$GITHUB_ENV"
          else
            git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            if grep -qE '^(native-gen/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files"; then
              echo "RUST=1" >> "$GITHUB_ENV"
            else
              echo "The crate did not change: nothing to run."
            fi
          fi

      - name: Install the toolchains
        if: env.RUST == '1'
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri

      - name: Format
        if: env.RUST == '1'
        run: |
          cargo +stable fmt --check
          cargo +stable fmt --check --manifest-path ../../rust/vm-check/Cargo.toml
          cargo +stable fmt --check --manifest-path ../../rust/gen-check/Cargo.toml

      - name: Lints
        if: env.RUST == '1'
        run: |
          cargo +stable clippy --all-targets -- -D warnings
          cargo +stable clippy --all-targets --manifest-path ../../rust/vm-check/Cargo.toml -- -D warnings

      - name: Test on the MSRV
        if: env.RUST == '1'
        run: cargo +"$MSRV" test

      - name: Test on stable
        if: env.RUST == '1'
        run: cargo +stable test

      - name: Doctests on nightly
        if: env.RUST == '1'
        run: cargo +"$NIGHTLY" test --doc

      - name: Test under Miri
        if: env.RUST == '1'
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +"$NIGHTLY" miri test --lib

      - name: Read the Agentica version of native-gen
        if: env.RUST == '1'
        run: |
          read -r version sha256 rest < ../../AGENTICA_VERSION
          echo "AGENTICA_VERSION=$version" >> "$GITHUB_ENV"
          echo "AGENTICA_SHA256=$sha256" >> "$GITHUB_ENV"

      - name: Install the Agentica release of native-gen
        if: env.RUST == '1'
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ env.AGENTICA_SHA256 }}

      # Collections run while one call keeps 200000 Strings in a Vec (the heap floor is off), so a term the root list
      # did not keep would come back wrong.
      - name: Run vm-check on the VM
        if: env.RUST == '1'
        run: RUSTUP_TOOLCHAIN=stable ../../rust/vm-check/run.sh

      # The Rust files that native-gen makes for the fixtures stats, shapes, kinds and shapes2, linted, built and run.
      - name: Run gen-check on the VM
        if: env.RUST == '1'
        run: RUSTUP_TOOLCHAIN=stable ../../rust/gen-check/run.sh

      # `cli.agc build` of examples/rust_math: the docs' copies of its files and outputs, the library and the
      # [native.math] entry it writes, a second build with nothing to do, an entry kept with its own file, and the
      # program's output on the real VM.
      - name: Run build-check on the VM
        if: env.RUST == '1'
        run: RUSTUP_TOOLCHAIN=stable ../../rust/build-check.sh

      # `cli.agc new --lang rust demo` in an empty folder, then build and the program on the real VM with no edit.
      - name: Run new-check on the VM
        if: env.RUST == '1'
        run: RUSTUP_TOOLCHAIN=stable ../../rust/new-check.sh
