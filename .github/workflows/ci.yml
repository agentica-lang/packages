name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.25.0
          sha256: 4ecf226a4a8c1ac2573bfe23674c387a40b0cc69f97ecbf408d9a7888ec9da3d # linux-x86_64

      # The locked packages of each folder, checked against the hashes of its agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          make install

      - name: Check
        run: make check

      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        run: make test
