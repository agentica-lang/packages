name: CI

# A pull request that changes only files that mark no package (the site, the top-level docs, a package's README or
# CHANGELOG: the rules of .github/scripts/changed-packages.sh) does not start CI; Pages builds the site.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
      - '.gitmodules'
      - '.github/workflows/pages.yml'
      - '*/README.md'
      - '*/CHANGELOG.md'

permissions:
  contents: read

# A new push to a pull request cancels its older run; a push to main gets a group of its own, so it is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The nightly of Miri and of the doctests that check error codes, pinned so a new nightly cannot break CI by itself.
  NIGHTLY: nightly-2026-11-01

jobs:
  # A pull request runs only the packages whose files changed (the rules are in the script), and only the doc examples
  # of a package whose only change is in its docs/; a push to main runs all of them. Each package runs on the Agentica
  # version of its AGENTICA_VERSION file, so the packages are grouped by version: one job of `packages` per group.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      rust: ${{ steps.groups.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history of the base branch, for the diff of a pull request.
          fetch-depth: 0

      - name: Find the changed packages and their versions
        id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        # The diff goes to a file first: in a pipe a failed git diff (no base branch, no merge base) would read as
        # "no package changed" and turn the required check green untested. groups is a JSON list of
        # {version, sha256, packages, docs} (docs: the packages that run only their doc examples), `[]` when no package
        # changed. rust is true when the crate of native-gen (or this file) changed, or on main.
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            packages=$(.github/scripts/changed-packages.sh < "$RUNNER_TEMP/changed-files")
            docs=$(.github/scripts/changed-packages.sh --docs < "$RUNNER_TEMP/changed-files")
            rust=false
            tr '\0' '\n' < "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/changed-lines"
            if grep -qE '^(native-gen/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-lines"; then
              rust=true
            fi
          else
            packages=$(.github/scripts/changed-packages.sh --all)
            docs=
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/versions"
          for p in $packages $docs; do
            # Reset first: a missing or empty file must not keep the values of the package before it.
            version= sha256=
            if [ -f "$p/AGENTICA_VERSION" ]; then read -r version sha256 rest < "$p/AGENTICA_VERSION" || true; fi
            if [ -z "$version" ] || [ -z "$sha256" ]; then
              echo "$p/AGENTICA_VERSION must hold the version and the sha256 of its linux-x86_64 archive" >&2
              exit 1
            fi
            kind=packages
            case " $docs " in *" $p "*) kind=docs ;; esac
            printf '%s\t%s\t%s\t%s\n' "$version" "$sha256" "$p" "$kind" >> "$RUNNER_TEMP/versions"
          done
          # One version with two sha256 values is an error: the job of the group would check only the first.
          groups=$(jq -cR -s 'split("\n") | map(select(. != "") | split("\t")) | group_by(.[0])
            | map(if (map(.[1]) | unique | length) > 1
              then error("Agentica \(.[0][0]) has two sha256 values: \(map(.[2] + " " + .[1]) | join(", "))")
              else {version: .[0][0], sha256: .[0][1],
                packages: (map(select(.[3] == "packages") | .[2]) | join(" ")),
                docs: (map(select(.[3] == "docs") | .[2]) | join(" "))} end)' \
            "$RUNNER_TEMP/versions")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          if [ -n "$packages$docs" ]; then echo "Packages to run: $groups"; else echo "No package changed: nothing to run."; fi
          echo "rust: $rust"

  # The packages of one Agentica version, on that release (setup-agentica caches each version). A group that only has
  # packages whose docs changed runs their doc examples alone, as `docs (VERSION)`.
  packages:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    name: ${{ matrix.packages != '' && 'packages' || 'docs' }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      PACKAGES: ${{ matrix.packages }}
      DOCS: ${{ matrix.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Agentica release of the group
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}

      # The locked packages of each folder, checked against the hashes of its agentica.lock. The Makefile takes the
      # list as an argument: its own assignment ignores the environment.
      - name: Install the packages
        run: |
          echo "Agentica $(agentica --version): $PACKAGES; doc examples only: $DOCS"
          make install PACKAGES="$PACKAGES $DOCS"

      - name: Check
        if: env.PACKAGES != ''
        run: make check PACKAGES="$PACKAGES"

      - name: Format
        if: env.PACKAGES != ''
        run: make fmt-check PACKAGES="$PACKAGES"

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        if: env.PACKAGES != ''
        run: make test PACKAGES="$PACKAGES"

      # The agentica code blocks of each docs/ folder run, or are checked.
      - name: Doc examples
        run: make doc-examples PACKAGES="$PACKAGES $DOCS"

  # `test` is the required check, so it carries the result of the other jobs: it fails when the plan did not pass, or
  # when a group of packages or the rust job failed (each is skipped when nothing of it changed).
  test:
    needs: [plan, packages, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the other jobs passed
        env:
          PLAN: ${{ needs.plan.result }}
          PACKAGES: ${{ needs.packages.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "plan: $PLAN, packages: $PACKAGES, rust: $RUST"
          [ "$PLAN" = success ] && [[ "$PACKAGES" =~ ^(success|skipped)$ ]] && [[ "$RUST" =~ ^(success|skipped)$ ]]

  # The Rust crate of native-gen (native-gen/native/agentica-native), when a pull request changes native-gen or this
  # file, and on main: its format and lints on stable, its tests on the MSRV of its Cargo.toml and on stable, its
  # doctests on nightly (which checks the error codes of the compile_fail ones), the tests under Miri, vm-check, a
  # module on the crate run by the Agentica release of native-gen (its AGENTICA_VERSION), gen-check, the modules on the
  # Rust files native-gen makes, build-check, `cli.agc build` of a Rust module, and new-check, the module
  # `new --lang rust` writes. The crate has no dependencies, so it needs no registry.
  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native-gen/native/agentica-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the toolchains
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri

      - name: Format
        run: |
          cargo +stable fmt --check
          cargo +stable fmt --check --manifest-path ../../rust/vm-check/Cargo.toml
          cargo +stable fmt --check --manifest-path ../../rust/gen-check/Cargo.toml

      - name: Lints
        run: |
          cargo +stable clippy --all-targets -- -D warnings
          cargo +stable clippy --all-targets --manifest-path ../../rust/vm-check/Cargo.toml -- -D warnings

      - name: Test on the MSRV
        run: cargo +"$MSRV" test

      - name: Test on stable
        run: cargo +stable test

      - name: Doctests on nightly
        run: cargo +"$NIGHTLY" test --doc

      - name: Test under Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +"$NIGHTLY" miri test --lib

      - name: Read the Agentica version of native-gen
        run: |
          version= sha256=
          read -r version sha256 rest < ../../AGENTICA_VERSION || true
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "native-gen/AGENTICA_VERSION must hold the version and the sha256 of its linux-x86_64 archive" >&2
            exit 1
          fi
          echo "AGENTICA_VERSION=$version" >> "$GITHUB_ENV"
          echo "AGENTICA_SHA256=$sha256" >> "$GITHUB_ENV"

      - name: Install the Agentica release of native-gen
        uses: agentica-lang/setup-agentica@v1
        with:
          version: ${{ env.AGENTICA_VERSION }}
          sha256: ${{ env.AGENTICA_SHA256 }}

      # Collections run while one call keeps 200000 Strings in a Vec (the heap floor is off), so a term the root list
      # did not keep would come back wrong.
      - name: Run vm-check on the VM
        run: RUSTUP_TOOLCHAIN=stable ../../rust/vm-check/run.sh

      # The Rust files that native-gen makes for the fixtures stats, shapes, kinds and shapes2, linted, built and run.
      - name: Run gen-check on the VM
        run: RUSTUP_TOOLCHAIN=stable ../../rust/gen-check/run.sh

      # `cli.agc build` of examples/rust_math: the docs' copies of its files and outputs, the library and the
      # [native.math] entry it writes, a second build with nothing to do, an entry kept with its own file, and the
      # program's output on the real VM.
      - name: Run build-check on the VM
        run: RUSTUP_TOOLCHAIN=stable ../../rust/build-check.sh

      # `cli.agc new --lang rust demo` in an empty folder, then build and the program on the real VM with no edit.
      - name: Run new-check on the VM
        run: RUSTUP_TOOLCHAIN=stable ../../rust/new-check.sh
