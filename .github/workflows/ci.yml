name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # `test` is the required check, so it also carries the result of the rust job: it waits for it, and fails when it
    # did not pass.
    needs: rust
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that the rust job passed
        if: needs.rust.result != 'success'
        env:
          RESULT: ${{ needs.rust.result }}
        run: |
          echo "The rust job ended with $RESULT." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history of the base branch, for the diff of a pull request.
          fetch-depth: 0

      # A pull request runs only the packages whose files changed (the rules are in the script); a push to main runs
      # all of them. The job always succeeds and keeps the name `test`, for the required check: with no package
      # changed the steps below are skipped. The Makefile takes the list as an argument: its own assignment ignores the
      # environment.
      - name: Find the changed packages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        # The diff goes to a file first: in a pipe a failed git diff (no base branch, no merge base) would read as
        # "no package changed" and turn the required check green untested.
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            packages=$(.github/scripts/changed-packages.sh < "$RUNNER_TEMP/changed-files")
          else
            packages=$(.github/scripts/changed-packages.sh --all)
          fi
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
          if [ -n "$packages" ]; then echo "Packages to run: $packages"; else echo "No package changed: nothing to run."; fi

      - name: Install the pinned Agentica release
        if: env.PACKAGES != ''
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.27.0
          sha256: 87319417a3ad3338af8117e0885cbabf63ae54c8e4539318829c221a342342f9 # linux-x86_64

      # The locked packages of each folder, checked against the hashes of its agentica.lock.
      - name: Install the packages
        if: env.PACKAGES != ''
        run: |
          agentica --version
          make install PACKAGES="$PACKAGES"

      - name: Check
        if: env.PACKAGES != ''
        run: make check PACKAGES="$PACKAGES"

      - name: Format
        if: env.PACKAGES != ''
        run: make fmt-check PACKAGES="$PACKAGES"

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        if: env.PACKAGES != ''
        run: make test PACKAGES="$PACKAGES"

      # The agentica code blocks of each docs/ folder run, or are checked.
      - name: Doc examples
        if: env.PACKAGES != ''
        run: make doc-examples PACKAGES="$PACKAGES"

  # The Rust crate of native-gen (native-gen/rust), when a pull request changes it or this file, and on main: its
  # format and lints on stable, its tests on the MSRV of its Cargo.toml and on stable, its doctests on nightly (which
  # checks the error codes of the compile_fail ones), the tests under Miri, and vm-check, a module on the crate run by
  # the pinned Agentica release. The crate has no dependencies, so it needs no registry.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native-gen/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Find whether the crate changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "RUST=1" >> "$GITHUB_ENV"
          else
            git diff --name-only --no-renames "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            if grep -qE '^(native-gen/rust/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files"; then
              echo "RUST=1" >> "$GITHUB_ENV"
            else
              echo "The crate did not change: nothing to run."
            fi
          fi

      - name: Install the toolchains
        if: env.RUST == '1'
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly --profile minimal --component miri

      - name: Format
        if: env.RUST == '1'
        run: |
          cargo +stable fmt --check
          cargo +stable fmt --check --manifest-path vm-check/Cargo.toml

      - name: Lints
        if: env.RUST == '1'
        run: |
          cargo +stable clippy --all-targets -- -D warnings
          cargo +stable clippy --all-targets --manifest-path vm-check/Cargo.toml -- -D warnings

      - name: Test on the MSRV
        if: env.RUST == '1'
        run: cargo +"$MSRV" test

      - name: Test on stable
        if: env.RUST == '1'
        run: cargo +stable test

      - name: Doctests on nightly
        if: env.RUST == '1'
        run: cargo +nightly test --doc

      - name: Test under Miri
        if: env.RUST == '1'
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test --lib

      - name: Install the pinned Agentica release
        if: env.RUST == '1'
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.27.0
          sha256: 87319417a3ad3338af8117e0885cbabf63ae54c8e4539318829c221a342342f9 # linux-x86_64

      # Collections run while one call keeps 200000 Strings in a Vec (the heap floor is off), so a term the root list
      # did not keep would come back wrong.
      - name: Run vm-check on the VM
        if: env.RUST == '1'
        run: RUSTUP_TOOLCHAIN=stable vm-check/run.sh
