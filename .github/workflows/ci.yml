name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history of the base branch, for the diff of a pull request.
          fetch-depth: 0

      # A pull request runs only the packages whose files changed (the rules are in the script); a push to main runs
      # all of them. The job always succeeds and keeps the name `test`, for the required check: with no package
      # changed the steps below are skipped. The Makefile takes the list as an argument: its own assignment ignores the
      # environment.
      - name: Find the changed packages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        # The diff goes to a file first: in a pipe a failed git diff (no base branch, no merge base) would read as
        # "no package changed" and turn the required check green untested.
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files"
            packages=$(.github/scripts/changed-packages.sh < "$RUNNER_TEMP/changed-files")
          else
            packages=$(.github/scripts/changed-packages.sh --all)
          fi
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
          if [ -n "$packages" ]; then echo "Packages to run: $packages"; else echo "No package changed: nothing to run."; fi

      - name: Install the pinned Agentica release
        if: env.PACKAGES != ''
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.27.0
          sha256: 87319417a3ad3338af8117e0885cbabf63ae54c8e4539318829c221a342342f9 # linux-x86_64

      # The locked packages of each folder, checked against the hashes of its agentica.lock.
      - name: Install the packages
        if: env.PACKAGES != ''
        run: |
          agentica --version
          make install PACKAGES="$PACKAGES"

      - name: Check
        if: env.PACKAGES != ''
        run: make check PACKAGES="$PACKAGES"

      - name: Format
        if: env.PACKAGES != ''
        run: make fmt-check PACKAGES="$PACKAGES"

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        if: env.PACKAGES != ''
        run: make test PACKAGES="$PACKAGES"
