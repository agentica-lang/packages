{{ define "main" }}
<article class="content">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{- if .Pages }}
  <h2>Pages</h2>
  <ul class="pages">
    {{- range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<span>{{ . }}</span>{{ end }}</li>
    {{- end }}
  </ul>
  {{- end }}
  {{ partial "source.html" . }}
</article>
{{ end }}
