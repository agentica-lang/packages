# The look, the layouts, the outputs and the highlighter come from the docs theme (themes/docs-theme, a submodule);
# `_merge = "deep"` takes its [outputs], [markup] and [minify] too. This file sets only what is the site's own.
# The packages' docs are not under site/: the Makefile writes mounts.toml (site/content and one mount per
# <package>/docs folder) and passes it as a second config file, so a package adds its docs by having a docs/ folder.
# The mounts are not in this file because the second file replaces a mount list instead of adding to it.
_merge = "deep"
baseURL = "https://agentica-lang.github.io/packages/"
locale = "en"
title = "Agentica packages"
theme = "docs-theme"
disableKinds = ["taxonomy", "term", "rss"]

[module.hugoVersion]
  min = "0.167.0"

# No version: each package has its own (see its CHANGELOG).
[params]
  description = "Small packages for the Agentica language: install one with a git tag and a subdir."
  repo = "https://github.com/agentica-lang/packages"
  repoPublic = true

# Plain quotes and dashes, as written in the Markdown (it is also what GitHub shows).
[markup.goldmark.extensions]
  typographer = false
